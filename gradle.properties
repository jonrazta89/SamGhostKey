org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 9.6-alpha 的 generate<Variant>ComposePreviewRunfiles 为每个 compose 变体建任务，realize 时要求该变体有单测组件；
# 默认只对 testBuildType(debug) 开单测，release 无组件会让 IDE 全量 realize 时报错、Gradle 同步失败。
# 关掉「只对测试构建类型开单测」，让 release 也具备单测组件，同步/构建不再因该任务报错。
android.onlyEnableUnitTestForTheTestedBuildType=false
