{
  # creek 家族通用配置（creek.conf）—— 回落层。
  #
  # 与 kernel_profiles/*.conf 正交：
  #   · kernel profile 按 `uname -r` 精确匹配，决定**正确性**（符号偏移/尺寸/锚点）；
  #   · device profile 决定**快慢**（编译期常量、调参、坑）。
  #
  # 这里只放**每次启动都不变**的量。KASLR slide 每次都变，必须运行时解，
  # 写进来会直接让注入失败。
  #
  # 回落链：`creek-creek.conf`（本机型专属）→ `creek.conf`（creek 家族通用）
  #         → 无（宿主退回 calibrate-b 运行时扫描）。
  # 字段级继承：下面没写的字段自动取 `creek.conf` 的值。

  product = "creek"
  device = "creek"

  # 机型名。⚠️ 待真机确认：POCO M7 有 4G/5G 等版本，`ro.product.marketname`
  # 才是对外机型名，这里先记产品线名。
  model = "POCO M7"

  # SoC 型号。⚠️ 待真机确认（`cat /proc/cpuinfo` 或 `getprop ro.soc.model`），
  # 确认前不写 —— 写错会误导后续适配。
  # soc = "..."

  # 本机型特有的坑 / 与家族通用值不同的地方，写在这里（覆盖 `creek.conf`）。
  # 例：这一台的页大小不是家族通用的 4K，就在这里写自己的 page_size。
  # page_size = 4096

  # 机型专属的调参（覆盖家族通用）：
  # flow = {
  #   calib_a = {
  #     probe = 2048
  #     hold = 2
  #   }
  # }

  _notes = "POCO M7（代号 creek / HyperOS 3.0.304.0.WBOMIXM / 5.15.194-android13-8-00019-gf4321180a397-ab15212794）专属层：只写本机型特有的项，页大小 / 线性映射基址 / slab object_size / calib_a 调参等家族共用项继承自 creek.conf（两者均为待实测初版）。真机采集命令见 .workbuddy/creek-device-profile-checklist.md。"
}
