{
  # 机型配置（device profile）—— 加速层，不是准入闸门。
  #
  # 与 kernel_profiles/*.conf 正交：
  #   · kernel profile 按 `uname -r` 精确匹配，决定**正确性**（符号偏移/尺寸）；
  #   · device profile 按 product-device 匹配，决定**快慢**（编译期常量、调参、坑）。
  #
  # 这里只放**每次启动都不变**的量。KASLR slide 每次都变，必须运行时解，
  # 写进来会直接让注入失败。
  product = "madrid"
  device = "madrid"
  model = "Xiaomi M154FF"
  soc = "SM8975"

  # 页大小：4K 页的 PAGE_OFFSET 与 16K/64K 不同，运行时必须对上。
  page_size = 4096

  # 线性映射基址。2026-10-31 真机 calibrate-b 实测 0xffffff8000000000
  # （confidence 190/197），与 vendor_boot 设备树 /memory base=0 一致。
  # 这是**编译期常量**（由 VA bits 与页大小决定），不随 KASLR 变。
  page_offset = 0xffffff8000000000

  # 人工确认过 → 宿主可以跳过 calibrate-b（真机实测省 ~9 秒）。
  # 若哪天换了页大小/DRAM 布局，把这里改回 0 即可退回运行时扫描。
  page_offset_trusted = 1

  # task_struct 的 slab object_size 实测值（含 CONFIG_THREAD_SIZE_IN_TSK 内嵌栈）。
  # BTF 的 sizeof(struct task_struct) 只有 4736，真实 object_size 是 5760。
  task_struct_object_size = 5760

  flow = {
    calib_a = {
      probe = 2048
      hold = 2
    }
  }

  _notes = "小米 18 Pro Max（madrid / SM8975 / Android 17 / 4K 页）。本文件由 2026-10-31 真机全链路实测生成：slide=0x16cb600000、page_offset=0xffffff8000000000、cred site=prepare_creds+0x30、task site=dup_task_struct+0x54、task object_size=0x1680。"
}
