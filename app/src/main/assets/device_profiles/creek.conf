{
  # creek 家族**通用**机型配置 —— 回落层。
  #
  # 分工：
  #   · 本文件（`<product>.conf`）放**家族共用**的量：页大小、线性映射基址、
  #     slab object_size、calibrate-a 调参；
  #   · 专属文件（`<product>-<device>.conf`，如 creek-creek.conf）只写这台机器
  #     特有的量：机型名、SoC、这台机器的坑。
  #
  # 回落是**字段级**的：专属配置没写的字段自动继承本文件；专属写了就以专属为准。
  # 家族里任何一台 creek-* 设备（哪怕还没有专属配置）都会命中本文件。
  #
  # 与 kernel_profiles/*.conf 正交：
  #   · kernel profile 按 `uname -r` 精确匹配，决定**正确性**（符号偏移/尺寸/锚点）；
  #   · device profile 决定**快慢**（编译期常量、调参、坑）。
  #
  # 这里只放**每次启动都不变**的量。KASLR slide 每次都变，必须运行时解，
  # 写进来会直接让注入失败。

  product = "creek"
  # 不写 device = 覆盖整个 creek 家族。

  # 页大小：4K 页的 PAGE_OFFSET 与 16K/64K 不同，运行时必须对上。
  #
  # 依据：creek 的内核 profile 里 page_offset = -551903297536，
  #      换算即 0xffffff8000000000 - 0x80000000，与 madrid 的 4K 基址同构。
  # ⚠️ 待真机确认（calibrate-b 输出的线性映射基址若不是 0xffffff8000000000，
  #    说明页大小不是 4K，这里必须改成对应值）。
  page_size = 4096

  # 线性映射基址（PAGE_OFFSET）。编译期常量，由 VA bits 与页大小决定，
  # 不随 KASLR 变，写进来就能省掉 calibrate-b 的全量扫描（madrid 实测省 ~9 秒）。
  #
  # 取值来自 creek 内核 profile 的 page_offset：
  #   -551903297536 + 0x80000000 = 0xffffff8000000000
  # ⚠️ 待真机确认后，才把下面的 page_offset_trusted 改成 1。
  page_offset = 0xffffff8000000000

  # 人工确认过 → 宿主可以跳过 calibrate-b。三个前提缺一不可（见
  # DeviceProfilePolicy.planPageOffset）：有 page_offset、显式 trusted、
  # 页大小与运行时一致。
  #
  # 当前保持 0：此时 planPageOffset 返回 trusted=false，宿主仍走运行时扫描，
  # 行为与「没有本文件」完全一致 —— 即便上面的推算值有偏差也不会出事。
  #
  # 显式写 0（而不是不写）是有意的：它会**否决**任何继承来的 1，
  # 保证本家族在真机确认前一律走运行时扫描。
  page_offset_trusted = 0

  # task_struct 的 slab object_size 实测值（含 CONFIG_THREAD_SIZE_IN_TSK 内嵌栈）。
  #
  # 注意：内核 profile 里的 task_struct_size = 4608 是 **BTF 的 sizeof(struct
  # task_struct)**，**不等于** slab object_size —— madrid 实测 BTF 4736 而真实
  # object_size 是 5760。填错会让铺页落到错误的对象上。
  #
  # ⚠️ 待实测后填入（真机跑一轮提权，从原生体日志取 slab object_size）。
  # task_struct_object_size = 0

  # calibrate-a 的探针次数 / 保持秒数（覆盖原生体默认值）。
  # madrid 用 probe=2048 / hold=2；creek 的 5.15 内核是否同值需实测。
  # ⚠️ 待实测调参。
  # flow = {
  #   calib_a = {
  #     probe = 2048
  #     hold = 2
  #   }
  # }

  _notes = "creek 家族通用层（POCO M7 / HyperOS 3.0.304.0.WBOMIXM / 5.15.194-android13-8-00019-gf4321180a397-ab15212794）。本文件为待实测初版：page_size / page_offset 由内核 profile 推得，尚未真机确认；page_offset_trusted 显式写 0（未生效，且会否决继承值）；task_struct_object_size 与 calib_a 调参待实测补齐。真机采集命令见 .workbuddy/creek-device-profile-checklist.md。"
}
