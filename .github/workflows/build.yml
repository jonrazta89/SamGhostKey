name: Build GhostKey APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-37
            build-tools;35.0.0
            ndk;27.0.12077973
            cmake;3.22.1

      - name: Configure Gradle
        run: |
          chmod +x ./gradlew
          echo "org.gradle.jvmargs=-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g" >> gradle.properties
          echo "kotlin.compiler.jvm.target=27" >> gradle.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          CVE98260_STORE_PASSWORD: ${{ secrets.CVE98260_STORE_PASSWORD }}
          CVE98260_KEY_PASSWORD: ${{ secrets.CVE98260_KEY_PASSWORD }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: GhostKey-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v5
        with:
          name: GhostKey-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v5
        with:
          name: GhostKey-debug
          path: artifacts/debug

      - name: Download Release APK
        uses: actions/download-artifact@v5
        with:
          name: GhostKey-release
          path: artifacts/release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GhostKey ${{ github.ref_name }}
          body: |
            ## GhostKey ${{ github.ref_name }}
            
            **CVE-2026-98260 Exploit Tool for Android**
            
            ### Changes
            - English UI translation complete
            - Kernel profile for Samsung S26 Ultra (6.12.69-android16-6)
            - JVM target alignment fixes
            
            ### Downloads
            - `GhostKey-${{ github.ref_name }}-debug.apk` - Debug build with logging
            - `GhostKey-${{ github.ref_name }}-release.apk` - Release build (signed)
            
            ### Usage
            1. Install APK on target device
            2. Grant Shizuku permission
            3. Ensure KernelSU/KSU Next/SukiSU is installed
            4. Import kernel profile (Settings → Import JSON)
            5. Tap "Start Exploit"
          draft: false
          prerelease: false
          files: |
            artifacts/debug/*.apk
            artifacts/release/*.apk
